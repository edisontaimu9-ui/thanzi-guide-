name = "thanzi-guide-push-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Weekly inactivity reminder — adjust cadence as needed.
# Cron syntax: minute hour day-of-month month day-of-week
[triggers]
crons = ["0 8 * * 1"]

# Non-secret config. Secrets (APPWRITE_API_KEY, APPWRITE_WEBHOOK_SECRET,
# VAPID_PRIVATE_KEY) are set separately with `wrangler secret put <NAME>`
# and must never go in this file or be committed.
[vars]
APPWRITE_ENDPOINT = "https://cloud.appwrite.io/v1"
APPWRITE_PROJECT_ID = "your-project-id"
APPWRITE_DATABASE_ID = "thanzi_guide"
VAPID_PUBLIC_KEY = "your-vapid-public-key"
VAPID_SUBJECT = "mailto:admin@thanziguide.example"
